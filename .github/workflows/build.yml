name: Build & Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  test:
    name: Test (Linux, offscreen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            runner: windows-latest
            arch: x64
            python: "3.12"
          - os: Linux
            runner: ubuntu-latest
            arch: x64
            python: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            # 从 Release tag 提取版本号
            VER="${{ github.event.release.tag_name }}"
          else
            # 手动触发时使用输入值
            VER="${{ inputs.version }}"
          fi
          echo "value=$VER" >> "$GITHUB_OUTPUT"

      # 打包逻辑统一在 tools/build.py，本地用同一条命令：
      #   python tools/build.py --version vX.Y.Z
      - name: Build package
        shell: bash
        run: python tools/build.py --version "${{ steps.version.outputs.value }}"
        env:
          PYTHONIOENCODING: utf-8

      - name: Verify build output
        shell: bash
        run: ls -lh dist/

      - name: Resolve artifact path
        id: artifact
        shell: bash
        run: |
          F=$(ls dist/SerialNetTool-* | head -n 1)
          echo "path=$F" >> "$GITHUB_OUTPUT"
          echo "artifact=$F"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerialNetTool-${{ steps.version.outputs.value }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

  release:
    name: Attach to Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
